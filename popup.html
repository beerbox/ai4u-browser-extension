<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Prompt Executor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="tab">
        <button class="tablinks" id="executor-tab-button">Prompt Executor</button>
        <button class="tablinks" id="settings-tab-button">Settings</button>
    </div>

    <div id="Executor" class="tabcontent">
        <h1>Prompt Executor</h1>
        <button id="execute-button">Execute Prompt</button>
        <div id="result">
            Click the button to execute the prompt...
        </div>
    </div>

    <div id="Settings" class="tabcontent">
        <h2>Prompt Settings</h2>
        <p>Enter your custom prompt below. Use <code>{{pageText}}</code> as a placeholder for the page content.</p>
        <textarea id="prompt-textarea"></textarea>
        
        <h2>Model Settings</h2>
        <p>Enter the name of the Ollama model to use (e.g., "gemma3:latest").</p>
        <input type="text" id="model-input" style="width: 95%; padding: 5px;">

        <button id="save-settings-button">Save Settings</button>
        <button id="restore-defaults-button">Restore Default</button>
        <div id="save-success" style="color: green; margin-top: 10px;"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
